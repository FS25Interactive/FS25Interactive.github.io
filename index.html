<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive Maps</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
</head>
<body class="min-h-screen bg-base-100 text-base-content">
<div class="wrap max-w-4xl mx-auto px-6 py-14">
  <header class="text-center mb-11">
    <span class="badge badge-primary badge-outline gap-1.5 mb-4 py-3"><i class="ti ti-tractor" aria-hidden="true"></i> Farming Simulator 25</span>
    <h1 class="text-3xl font-bold tracking-tight mb-2.5">Interactive Maps</h1>
    <p class="text-base-content/60 text-[15px] max-w-md mx-auto leading-relaxed">Interactive field-management maps for keeping track of owners, crops, soil, and work &mdash; pick a map to open it.</p>
  </header>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5" id="mapGrid"></div>

  <footer class="text-center mt-14 text-base-content/60 text-xs">Each map keeps its own save data and cloud sync &mdash; nothing here is shared between them.</footer>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
